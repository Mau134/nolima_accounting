# Builds the Windows installer on GitHub's Windows machines.
# - Every push to main: installer available under the run's "Artifacts".
# Releases that customers receive are published from your PC with release_update.bat,
# because they must be signed with your private key, which never goes to GitHub.
name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check licence public key is committed
        run: python -c "from nolima_acc import license_pubkey as k; import sys; sys.exit(0 if k.PUBLIC_KEY_HEX else 'No PUBLIC_KEY_HEX in nolima_acc/license_pubkey.py - run the licence generator and commit that file')"

      - name: Run tests
        run: python tests/test_core.py

      - name: Build program folder
        run: python -m PyInstaller --noconfirm --clean --workpath .pyibuild NolimaAccounting.spec

      - name: Build installer
        shell: pwsh
        run: |
          $v = python -c "import nolima_acc; print(nolima_acc.__version__)"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$v" build\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: NolimaAccounting-Setup
          path: Output/*.exe
